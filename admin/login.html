<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen Admin | Executive Portal Login</title>
  <meta name="description" content="Secure Administrator Authentication Portal for NextGen Store Management.">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../user/css/main.css">
  <link rel="stylesheet" href="../user/css/components.css">
  <link rel="stylesheet" href="./css/admin.css">

  <!-- Favicon -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'><rect width='24' height='24' rx='6' fill='%236366f1'/><path d='M5 18.5V5.5L13.5 15.5V5.5' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M15.5 9L18.5 12L15.5 15' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>">

  <style>
    body {
      background: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.15) 0%, rgba(17, 24, 39, 0.95) 70%), #0b0f19;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .admin-login-wrapper {
      width: 100%;
      max-width: 440px;
    }

    .admin-login-card {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-xl);
      padding: 2.75rem 2.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 35px rgba(99, 102, 241, 0.2);
      position: relative;
      overflow: hidden;
    }

    .admin-login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--accent-gradient);
    }

    .admin-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.4);
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.25rem;
    }

    .password-input-wrap {
      position: relative;
    }

    .password-toggle-btn {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      background: none;
      border: none;
    }

    .password-toggle-btn:hover {
      color: var(--text-primary);
    }

    .brand-logo span {
      color: #ffffff !important;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
  </style>
</head>

<body>

  <div class="admin-login-wrapper">
    <!-- Brand Logo -->
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <a href="../index.html" class="brand-logo" style="justify-content: center; font-size: 1.75rem; text-decoration: none;">
        <div class="brand-icon" style="width: 44px; height: 44px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 19.5V4.5L14 16.5V4.5" stroke="white" stroke-width="2.6" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M16.5 8.5L20 12L16.5 15.5" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"
              stroke-linejoin="round" />
            <circle cx="20" cy="5" r="1.8" fill="#38bdf8" />
          </svg>
        </div>
        <span style="color: #ffffff !important; font-weight: 800;">NextGen Store</span>
      </a>
    </div>

    <!-- Login Card -->
    <div class="admin-login-card">
      <div style="text-align: center;">
        <div class="admin-badge-pill">
          <span>🔒</span> Administrator Portal
        </div>
        <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem; font-weight: 800;">Admin Sign In</h1>
        <p style="font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 2rem;">
          Enter your authorized credentials to manage store catalog, orders, and sales metrics.
        </p>
      </div>

      <!-- Admin Login Form -->
      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label" for="adminEmail">Administrator Email</label>
          <input type="email" id="adminEmail" class="form-input" placeholder="admin@gmail.com" value="admin@gmail.com"
            required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="adminPassword">Security Password</label>
          <div class="password-input-wrap">
            <input type="password" id="adminPassword" class="form-input" placeholder="••••••••" value="admin123"
              required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" id="togglePasswordBtn"
              aria-label="Toggle Password Visibility">
              👁️
            </button>
          </div>
        </div>

        <div
          style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.75rem; font-size: 0.85rem;">
          <label
            style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; color: var(--text-secondary);">
            <input type="checkbox" id="rememberAdminCheckbox" checked> Keep session active
          </label>
          <span style="color: var(--text-muted); font-size: 0.8rem;">Firestore Protected</span>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;" id="adminLoginBtn">
          Sign In to Dashboard
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <!-- Back to Storefront Link -->
      <div
        style="margin-top: 2rem; text-align: center; border-top: 1px solid var(--glass-border); padding-top: 1.25rem;">
        <a href="../index.html"
          style="font-size: 0.85rem; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 0.4rem; transition: var(--transition);">
          ← Return to Customer Storefront
        </a>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Admin Login Controller -->
  <script type="module" src="./js/admin-login.js"></script>
</body>

</html>
